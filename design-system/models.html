<!DOCTYPE html>
<html lang="sv" data-theme="light">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--canvas:#F7F7F4;--surface:#FFFFFF;--sunken:#F0F0EB;--ink:#0B0B0D;--ink-2:#0B0B0D;--ink-3:#2C2C30;--line:#E7E7E1;--line-2:#DBDBD4;--accent:#3B5BDB;--ok:#2E9E6A;--btn-bg:#17171B;--btn-fg:#FFFFFF;--track:#EFEFEA}
  [data-theme="dark"]{--canvas:#0D0D10;--surface:#16161A;--sunken:#1D1D22;--ink:#FFFFFF;--ink-2:#FFFFFF;--ink-3:#D6D6DA;--line:#26262E;--line-2:#313139;--accent:#8298FF;--ok:#48BE8A;--btn-bg:#F3F3F4;--btn-fg:#141419;--track:#1D1D23}
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:'Geist',system-ui,sans-serif;letter-spacing:-.01em;padding:28px}
  .wrap{max-width:760px;margin:0 auto}
  h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0 0 16px}
  .hw{display:flex;gap:12px;background:var(--ink);color:var(--btn-fg);border-radius:14px;padding:14px 16px;margin-bottom:18px;font-size:13px}
  .hw b{font-weight:600}
  .card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
  .nm{font-size:15px;font-weight:600}
  .meta{font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .ok{font-size:12px;font-weight:600;color:var(--ok);display:inline-flex;align-items:center;gap:5px}
  .ok::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .btn{margin-left:auto;background:var(--btn-bg);color:var(--btn-fg);border:none;border-radius:9px;padding:8px 14px;font-size:13.5px;font-weight:500;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Transkriberingsmodeller</h1>
    <div class="hw"><span>🖥️ <b>RTX 4090</b> · 24 GB VRAM</span><span style="margin-left:auto">Disk: <b>D:</b> · 412 GB ledigt</span></div>
    <div class="card">
      <div style="flex:1"><div class="nm">KB-Whisper large <span style="font-size:12px;color:var(--ink-3)">(sv)</span></div><div class="meta">~10 GB · svenska · bäst kvalitet</div></div>
      <span class="ok">Installerad</span>
    </div>
    <div class="card">
      <div style="flex:1"><div class="nm">Qwen3 30B-A3B</div><div class="meta">~21 GB · korrigering / sammanfattning / chatt</div></div>
      <button class="btn">Ladda ner</button>
    </div>
  </div>
</body>
</html>
