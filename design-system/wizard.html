<!DOCTYPE html>
<html lang="sv" data-theme="light">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--canvas:#F7F7F4;--surface:#FFFFFF;--sunken:#F0F0EB;--ink:#0B0B0D;--ink-2:#0B0B0D;--ink-3:#2C2C30;--line:#E7E7E1;--line-2:#DBDBD4;--accent:#3B5BDB;--ok:#2E9E6A;--btn-bg:#17171B;--btn-fg:#FFFFFF;--track:#EFEFEA;--shadow-sm:0 1px 2px rgba(20,20,30,.06)}
  [data-theme="dark"]{--canvas:#0D0D10;--surface:#16161A;--sunken:#1D1D22;--ink:#FFFFFF;--ink-2:#FFFFFF;--ink-3:#D6D6DA;--line:#26262E;--line-2:#313139;--accent:#8298FF;--ok:#48BE8A;--btn-bg:#F3F3F4;--btn-fg:#141419;--track:#1D1D23;--shadow-sm:0 1px 2px rgba(0,0,0,.5)}
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:'Geist',system-ui,sans-serif;letter-spacing:-.01em;padding:28px}
  .wrap{max-width:760px;margin:0 auto}
  .steps{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-3);margin-bottom:26px}
  .dot{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;border:1px solid var(--line-2)}
  .dot.done{background:var(--ok);color:#fff;border-color:var(--ok)}
  .dot.cur{background:var(--ink);color:var(--btn-fg);border-color:var(--ink)}
  .line{flex:1;height:1px;background:var(--line)}
  h1{font-size:30px;font-weight:600;letter-spacing:-.03em;text-align:center;margin:0 0 6px}
  .lead{text-align:center;color:var(--ink-3);font-size:14px;margin:0 0 18px}
  .drop{border:1.5px dashed var(--line-2);border-radius:18px;background:var(--surface);padding:54px 20px;text-align:center}
  .drop .big{font-size:19px;font-weight:500;margin-bottom:6px}
  .drop .fmt{font-size:13px;color:var(--ink-3)}
  .queue{margin-top:16px;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 14px}
  .badge{font-size:11px;font-weight:600;background:var(--sunken);border-radius:6px;padding:3px 7px;color:var(--ink-2)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="steps">
      <span class="dot cur">1</span> Källa <span class="line"></span>
      <span class="dot">2</span> Inställningar <span class="line"></span>
      <span class="dot">3</span> Resultat
    </div>
    <h1>Vad vill du transkribera?</h1>
    <p class="lead">Dra in en eller flera filer, eller välj från datorn — allt körs på din egen dator.</p>
    <div class="drop">
      <div class="big">Dra in filer — eller klicka för att välja</div>
      <div class="fmt">MP4 · MKV · MOV · MP3 · WAV · M4A — flera filer går bra</div>
    </div>
    <div class="queue">
      <span class="badge">MP3</span><span style="flex:1">mötesinspelning.mp3</span>
      <span style="color:var(--ink-3);font-size:18px">×</span>
    </div>
  </div>
</body>
</html>
