<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="sv" data-theme="light">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#F7F7F4; --surface:#FFFFFF; --sunken:#F0F0EB;
    --ink:#0B0B0D; --ink-2:#0B0B0D; --ink-3:#2C2C30;
    --line:#E7E7E1; --line-2:#DBDBD4; --accent:#3B5BDB;
    --btn-bg:#17171B; --btn-fg:#FFFFFF; --track:#EFEFEA;
    --shadow-sm:0 1px 2px rgba(20,20,30,.06);
  }
  [data-theme="dark"]{
    --canvas:#0D0D10; --surface:#16161A; --sunken:#1D1D22;
    --ink:#FFFFFF; --ink-2:#FFFFFF; --ink-3:#D6D6DA;
    --line:#26262E; --line-2:#313139; --accent:#8298FF;
    --btn-bg:#F3F3F4; --btn-fg:#141419; --track:#1D1D23;
    --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  }
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:'Geist',system-ui,sans-serif;letter-spacing:-.01em;padding:28px}
  h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px}
  .sub{color:var(--ink-3);font-size:13px;margin:0 0 22px}
  .lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin:22px 0 10px}
  button{font-family:inherit}
  .seg{display:inline-flex;gap:3px;padding:4px;background:var(--track);border:1px solid var(--line);border-radius:11px}
  .seg button{border:none;border-radius:8px;padding:8px 14px;font-size:15px;font-weight:500;cursor:pointer;background:transparent;color:var(--ink-2)}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
  .chips{display:flex;gap:6px}
  .chips button{border-radius:8px;padding:7px 14px;font-size:13.5px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--ink-2);border:1px solid var(--line)}
  .chips button[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
  .switch{position:relative;width:42px;height:25px;border-radius:999px;background:var(--line-2);cursor:pointer;flex:0 0 auto}
  .switch.on{background:var(--ink)}
  .knob{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .switch.on .knob{transform:translateX(17px)}
  .swrow{display:flex;align-items:center;gap:12px}
</style>
</head>
<body>
  <h1>Kontroller</h1>
  <p class="sub">Segmentkontroller, format-chips och toggles. Valt läge exponerar <code>aria-pressed="true"</code> (a11y, fix F).</p>

  <div class="lbl">Navigeringsflikar</div>
  <div class="seg">
    <button aria-pressed="true">Transkribera</button>
    <button aria-pressed="false">Historik</button>
    <button aria-pressed="false">Lektioner</button>
    <button aria-pressed="false">Modeller</button>
  </div>

  <div class="lbl">Språkväljare</div>
  <div class="seg">
    <button aria-pressed="true">Svenska</button>
    <button aria-pressed="false">Engelska</button>
  </div>

  <div class="lbl">Format-chips (oberoende toggles)</div>
  <div class="chips">
    <button aria-pressed="true">SRT</button>
    <button aria-pressed="true">TXT</button>
    <button aria-pressed="false">VTT</button>
  </div>

  <div class="lbl">Toggle — "Rätta mot ljudet"</div>
  <div class="swrow">
    <div class="switch on"><span class="knob"></span></div><span style="font-size:14px">På</span>
    <div class="switch" style="margin-left:18px"><span class="knob"></span></div><span style="font-size:14px;color:var(--ink-3)">Av</span>
  </div>
</body>
</html>
