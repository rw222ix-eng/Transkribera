<!DOCTYPE html>
<html lang="sv" data-theme="light">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--canvas:#F7F7F4;--surface:#FFFFFF;--sunken:#F0F0EB;--ink:#0B0B0D;--ink-2:#0B0B0D;--ink-3:#2C2C30;--line:#E7E7E1;--line-2:#DBDBD4;--accent:#3B5BDB;--accent-weak:#EDF0FC;--ok:#2E9E6A;--track:#EFEFEA}
  [data-theme="dark"]{--canvas:#0D0D10;--surface:#16161A;--sunken:#1D1D22;--ink:#FFFFFF;--ink-2:#FFFFFF;--ink-3:#D6D6DA;--line:#26262E;--line-2:#313139;--accent:#8298FF;--accent-weak:#1A1E2E;--ok:#48BE8A;--track:#1D1D23}
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:'Geist',system-ui,sans-serif;letter-spacing:-.01em;padding:28px}
  .wrap{max-width:760px;margin:0 auto}
  h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0 0 16px}
  .search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:18px}
  .seg{margin-left:auto;display:inline-flex;gap:3px;padding:3px;background:var(--track);border:1px solid var(--line);border-radius:11px}
  .seg button{border:none;border-radius:9px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;background:transparent;color:var(--ink-3)}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,20,30,.06)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px}
  .ttl{font-size:15px;font-weight:600}
  .ins{display:flex;align-items:flex-start;gap:10px;margin-top:10px;font-size:14px}
  .chk{flex:0 0 auto;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--ok);background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px}
  .btn{background:var(--accent-weak);color:var(--accent);border:1px solid var(--accent);border-radius:9px;padding:7px 14px;font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer}
  .btn.ghost{background:var(--surface);color:var(--ink-2);border:1px solid var(--line)}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Lektioner</h1>
    <div class="search">
      <span style="font-size:13.5px;font-weight:600;color:var(--ink-2)">🔎 Sök i alla lektioner</span>
      <div class="seg"><button aria-pressed="true">Sök ord</button><button aria-pressed="false">Fråga (AI)</button></div>
    </div>
    <div class="card">
      <div style="display:flex;align-items:center"><div class="ttl" style="flex:1">Matematik · Bråk och procent</div>
        <button class="btn ghost" style="margin-right:8px">📄 Rapport</button><button class="btn">✨ Analysera lektion</button></div>
      <div class="ins"><span class="chk">✓</span><div>Räkna uppgift 5 till nästa gång. <span style="color:var(--ink-3)">· åtgärd</span></div></div>
    </div>
  </div>
</body>
</html>
